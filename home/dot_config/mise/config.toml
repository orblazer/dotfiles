[settings]
env_file = '.env'
experimental = true

# Trust mise config in development directory
trusted_config_paths = ['~/development/*']

[settings.java]
shorthand_vendor = "temurin"

[settings.npm]
package_manager = "pnpm"

[tools]
chezmoi = "2.72"
flux2 = "2.9"
kubectl = "1.36"
"github:alltuner/mise-completions-sync" = "0.5"
shellcheck = "0.11"
usage = "6.9" # needed for mise completion (installed here, cause manjaro package is too old, need 3.5+)

[hooks]
postinstall = "misecompsync --new-only --shell zsh"
